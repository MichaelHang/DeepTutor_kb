short_description: "Retrieve relevant passages from one of the attached knowledge bases."
when_to_use: "Use when the answer is likely covered by the attached knowledge bases — definitions, formulas, concepts, or textbook explanations."
input_format: "{\"query\": \"non-empty natural-language query\", \"kb_name\": \"one of the attached knowledge base names\", \"source_path\": \"optional exact document path from kb_files\"}."
guideline: "Prefer RAG before external search for course material. For concept discovery, query in the source language too when needed. When the question names one specific paper, exam or file, pass its source_path from kb_files so the search stays inside that document and every passage stays attributable to it; pass a list of paths to scope several documents in one call. Every returned passage names the document it came from, so quote that name when you cite it. For an exact figure, use figure plus source_path from kb_files; for a vector diagram, sparse caption, table or unreadable labels use source_path/page and optionally region=[x0,y0,x1,y1] normalized to 0..1. Reuse asset_id or source_hash from a citation for follow-ups; retrieve actual pixels again before detailed visual claims. Compare two sources with separate bounded calls."
note: "The query must be non-empty. Keep figure/table numbers and source boundaries exact. Ambiguity, missing pixels, unsupported pages or conflicting evidence require source selection, page inspection or abstention; never substitute a related figure. Distinguish visible observations, caption-only interpretation and general background. A citation and original image must support each source-specific claim. source_path on its own scopes the search to those documents and never falls back to a whole-KB search; do not drop a required source scope to retry against the whole knowledge base."
phase: "exploration"
